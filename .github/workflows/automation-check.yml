name: Automation checks

on:
  pull_request:
    paths:
      - 'scripts/review-affiliation*.cjs'
      - '.github/workflows/affiliation-*.yml'
      - '.github/workflows/automation-check.yml'
      - '.agents/skills/project-review/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/review-affiliation.test.cjs
