name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate workflows and script syntax
        run: python scripts/validate-automation.py
      - name: Validate issue forms
        run: python scripts/validate-issue-forms.py
      - name: Test the affiliation bot
        run: node --test scripts/review-affiliation.test.cjs
      - name: Test health-check configuration handling
        run: python -m unittest discover -s scripts -p 'test_*.py'
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation and template links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --verbose --no-progress './**/*.md' './.github/**/*.yml'
        env:
          GITHUB_TOKEN: ${{ github.token }}
