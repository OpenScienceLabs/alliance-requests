name: Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Maintenance task (health requires data/affiliated-projects.json)'
        type: choice
        options: [labels, health, reminders]
        default: labels
        required: true
  schedule:
    - cron: '0 9 * * 1'
    - cron: '0 8 1 */3 *'

permissions:
  contents: read

concurrency:
  group: maintenance-${{ inputs.task || github.event.schedule }}
  cancel-in-progress: false

jobs:
  labels:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'labels'
    permissions:
      issues: read
    runs-on: ubuntu-latest
    steps:
      - name: List repository labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label list --repo "$GITHUB_REPOSITORY"
  health:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.task == 'health') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 8 1 */3 *' &&
       vars.ENABLE_PROJECT_HEALTH_CHECKS == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check the configured public project registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-affiliated-projects.py --require-projects --repo "$GITHUB_REPOSITORY" --output health-check-report.md
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: affiliation-health-check-report
          path: health-check-report.md
          if-no-files-found: warn
  reminders:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.task == 'reminders') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1' &&
       vars.ENABLE_STALE_REMINDERS == 'true')
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11.0.0
        with:
          only-issue-labels: 'type: affiliation-request,status: needs-info'
          days-before-issue-stale: 30
          days-before-issue-close: -1
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: 'bot: stale'
          exempt-issue-labels: 'status: approved,status: declined,status: in-review,status: paused,status: removed,status: reactivated'
          stale-issue-message: |
            This affiliation request has been waiting for information without activity for about 30 days.

            Please add the missing evidence or let OSL reviewers know if you need more time. A human reviewer will decide any further follow-up or closure.
