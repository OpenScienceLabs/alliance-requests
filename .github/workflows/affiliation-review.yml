name: Affiliation preliminary review

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

# Serialize publication so simultaneous opened/labeled events reuse one comment.
concurrency:
  group: affiliation-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.state == 'open' &&
      (github.event.action == 'opened' || github.event.label.name == 'status: needs-triage') &&
      (contains(github.event.issue.labels.*.name, 'type: affiliation-request') ||
       startsWith(github.event.issue.title, 'Affiliation request:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review public evidence and update the preliminary report
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        with:
          script: |
            const { run } = require('./scripts/review-affiliation.cjs');
            await run({ github, context, core });
