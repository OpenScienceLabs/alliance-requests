name: Affiliation bot

on:
  issues:
    types: [opened, edited, reopened, transferred, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open affiliation/incubation application issue number'
        required: true
        type: string
      preview:
        description: 'Generate an evaluation in the run summary without changing the issue'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# Serialize publication so simultaneous opened/labeled events reuse one comment.
concurrency:
  group: affiliation-review-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       (github.event.action != 'labeled' || github.event.label.name == 'status: needs-triage'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Handle intake and requested preliminary review
        uses: actions/github-script@v9.0.0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        with:
          script: |
            const { run } = require('./scripts/review-affiliation.cjs');
            const preview = context.payload.inputs?.preview === 'true' ||
              context.payload.inputs?.preview === true;
            core.info(preview
              ? 'Review mode: preview. The evaluation will be saved in the run summary; the issue will not change.'
              : 'Review mode: publish. The evaluation must be saved and read back from the issue before this run succeeds.');
            await run({
              github, context, core, publish: !preview,
              outputDirectory: require('node:path').join(process.env.RUNNER_TEMP, 'osl-review')
            });
      - name: Save evaluation and outcome
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: affiliation-review-${{ github.event.issue.number || inputs.issue_number }}
          path: ${{ runner.temp }}/osl-review/
          if-no-files-found: warn
