name: Affiliation bot

on:
  issues:
    types: [opened, edited, reopened, transferred, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open affiliation/incubation application issue number'
        required: true
        type: string

permissions:
  contents: read
  issues: write

# Serialize publication so simultaneous opened/labeled events reuse one comment.
concurrency:
  group: affiliation-review-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       (github.event.action != 'labeled' || github.event.label.name == 'status: needs-triage'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Handle intake and requested preliminary review
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        with:
          script: |
            const { run } = require('./scripts/review-affiliation.cjs');
            await run({ github, context, core });
